{% extends 'base.html' %}
{% block title %}შესვლა{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>შესვლა</h1>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    {% include 'partials/form_fields.html' %}
    <button class="btn btn-block" type="submit">შესვლა</button>
  </form>
  <p>არ გაქვს ანგარიში? <a href="{% url 'register' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">რეგისტრაცია</a></p>
</div>
{% endblock %}
