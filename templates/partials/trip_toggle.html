<div class="toggles">
  <div class="trip-toggle">
    {% for radio in form.trip_type %}
      <label>
        <input type="radio" name="{{ radio.data.name }}" value="{{ radio.data.value }}"
               {% if radio.data.selected or not form.trip_type.value and forloop.first %}checked{% endif %}>
        <span>{{ radio.choice_label }}</span>
      </label>
    {% endfor %}
  </div>
  <div class="trip-toggle cabin-toggle">
    {% for radio in form.cabin %}
      <label>
        <input type="radio" name="{{ radio.data.name }}" value="{{ radio.data.value }}"
               {% if radio.data.selected or not form.cabin.value and forloop.first %}checked{% endif %}>
        <span>{% if forloop.first %}💺{% else %}🥂{% endif %} {{ radio.choice_label }}</span>
      </label>
    {% endfor %}
  </div>
</div>
